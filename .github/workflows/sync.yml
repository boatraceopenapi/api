name: Sync

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: gh-pages

jobs:
  sync-and-commit:
    name: Sync and commit on PHP ${{ matrix.php-version }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version:
          - '8.5'
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies (without scraper)
        run: |
          composer remove turnmark/scraper --no-update || true
          composer install --prefer-dist --no-interaction --no-progress

      - name: Require scraper ^0.5
        run: |
          composer require turnmark/scraper:^0.5 --no-update
          composer update turnmark/scraper --with-dependencies
          composer install --prefer-dist --no-interaction --no-progress

      - name: Sync with remote JSON files
        run: |
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Sync JSON files
        run: php bin/sync.php v1

      - name: Validate JSON files
        id: validate
        run: |
          set -e
          FILES=$(
            {
              git ls-files -m -- 'docs/v1' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v1' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v1' | grep '\.json$'
            } | sort -u
          )

          if [ -z "$FILES" ]; then
            echo "No JSON changes in docs/v1."
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files_changed=true" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/changed_files.txt

          if echo "$FILES" | xargs grep -l '^<<<<<<<\|^=======$\|^>>>>>>>' 2>/dev/null; then
            echo "::error::merge conflict markers found in generated JSON"
            exit 1
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error::invalid JSON: $f"
              exit 1
            fi
          done < /tmp/changed_files.txt

      - name: Commit JSON files
        if: steps.validate.outputs.files_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add $(cat /tmp/changed_files.txt)

          git commit -m "chore: deploy JSON files to docs/v1" || {
            echo "Nothing to commit."
            exit 0
          }

          git push origin HEAD:"${TARGET_BRANCH}" || (git pull --rebase origin "${TARGET_BRANCH}" && git push origin HEAD:"${TARGET_BRANCH}")
