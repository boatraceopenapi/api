name: Deploy Pages

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'docs/v1/**.json'
  workflow_dispatch:

# デプロイは公開サイズに比例して長くなる（3.4 GiB で約 160 秒）。実行中を取り消すと、
# 起動間隔より長くなったときに 1 回も終わらなくなるので、最後まで終えてから最新の 1 件を流す
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Deploy to pages (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # 同じジョブ内ではリトライしない。デプロイ ID はコミットの SHA なので、作り直しても
      # 時間切れで取り消した同じデプロイを見るだけになる。次の push が新しい SHA でやり直す
      - name: Deploy to pages
        id: deployment
        uses: actions/deploy-pages@v5
