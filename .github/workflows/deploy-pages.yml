name: Deploy Pages

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'docs/v1/**.json'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Deploy to pages (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment-final.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Initial deploy failed. Retrying in 15s..."
          sleep 15

      - name: Deploy to pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Set final deployment result
        id: deployment-final
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" == "success" ]; then
            echo "page_url=${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            echo "Deployment succeeded on first attempt."
          elif [ "${{ steps.deployment-retry.outcome }}" == "success" ]; then
            echo "page_url=${{ steps.deployment-retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            echo "Deployment succeeded on retry."
          else
            echo "::error::Deployment failed after retry."
            exit 1
          fi
