name: Sync Upcoming

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-commit:
    name: Sync and commit v1 on PHP ${{ matrix.php-version }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version:
          - '8.5'
    outputs:
      files_changed: ${{ steps.validate.outputs.files_changed }}
    steps:
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies (without Scraper)
        run: |
          composer remove turnmark/scraper --no-update || true
          composer install --prefer-dist --no-interaction --no-progress

      - name: Require scraper ^0.3
        run: |
          composer require turnmark/scraper:^0.3 --no-update
          composer update turnmark/scraper --with-dependencies
          composer install --prefer-dist --no-interaction --no-progress

      - name: Sync with remote before generating files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Sync JSON
        run: php bin/sync-upcoming.php v1

      - name: Validate generated JSON
        id: validate
        run: |
          set -e
          FILES=$(
            {
              git ls-files -m -- 'docs/v1' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v1' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v1' | grep '\.json$'
            } | sort -u
          )

          if [ -z "$FILES" ]; then
            echo "No JSON changes in docs/v1."
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files_changed=true" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/changed_files.txt

          if echo "$FILES" | xargs grep -l '^<<<<<<<\|^=======$\|^>>>>>>>' 2>/dev/null; then
            echo "::error::merge conflict markers found in generated JSON"
            exit 1
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error::invalid JSON: $f"
              exit 1
            fi
          done < /tmp/changed_files.txt

      - name: Deploy JSON
        if: steps.validate.outputs.files_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add $(cat /tmp/changed_files.txt)

          git commit -m "chore: deploy JSON files to docs/v1 [skip ci]" || {
            echo "Nothing to commit."
            exit 0
          }

          git push origin HEAD || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD)

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: sync-and-commit
    if: needs.sync-and-commit.outputs.files_changed == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
